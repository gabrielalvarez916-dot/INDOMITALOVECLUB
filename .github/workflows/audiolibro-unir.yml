name: Unir capítulos de audiolibros

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: audiolibro-unir
  cancel-in-progress: false

jobs:
  unir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar ffmpeg
        run: which ffmpeg >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Preparar zip
        run: which zip >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq zip)
      - name: Instalar dependencias
        run: cd scripts && npm install --no-audit --no-fund aws4fetch@1.0.20
      - name: Unir capítulos listos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_AUDIO_ACCESS_KEY_ID: ${{ secrets.R2_AUDIO_ACCESS_KEY_ID }}
          R2_AUDIO_SECRET_ACCESS_KEY: ${{ secrets.R2_AUDIO_SECRET_ACCESS_KEY }}
          R2_AUDIO_BUCKET: ${{ secrets.R2_AUDIO_BUCKET }}
        run: node scripts/audiolibro-unir.mjs
