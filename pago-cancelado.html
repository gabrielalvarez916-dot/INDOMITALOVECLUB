<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google tag (gtag.js) -->

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pago cancelado — Indómita Love Club</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bordo: #8B1A2B;
    --bordo-oscuro: #5C0F1A;
    --bordo-claro: #B03048;
    --rosa: #F2C4CE;
    --rosa-claro: #FAE8EC;
    --crema: #F5ECD7;
    --crema-suave: #FAF7F4;
    --blanco: #FFFFFF;
    --gris-texto: #2A2A2A;
    --gris-medio: #666666;
    --gris-borde: #E5E0D8;
    --error: #C0392B;
    --ok: #27AE60;
    --fuente-titulo: 'Playfair Display', Georgia, serif;
    --fuente-texto: 'Lato', sans-serif;
    --radio: 10px;
    --radio-grande: 18px;
    --sombra: 0 2px 20px rgba(139, 26, 43, 0.08);
    --sombra-fuerte: 0 8px 40px rgba(139, 26, 43, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--fuente-texto);
    background: linear-gradient(160deg, var(--crema-suave), var(--rosa-claro));
    color: var(--gris-texto);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .tarjeta {
    background: var(--blanco);
    border-radius: var(--radio-grande);
    box-shadow: var(--sombra-fuerte);
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
  }
  .logo-texto {
    font-family: var(--fuente-titulo);
    font-weight: 700;
    font-size: 15px;
    color: var(--bordo);
    text-align: center;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .pantalla-estado { text-align: center; padding: 12px 0; }
  .pantalla-estado .icono { font-size: 52px; margin-bottom: 16px; }
  .pantalla-estado h1 {
    font-family: var(--fuente-titulo);
    font-size: 24px;
    color: var(--bordo-oscuro);
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .pantalla-estado p { color: var(--gris-medio); font-size: 14px; line-height: 1.6; }
  .acciones { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .btn-primario, .btn-secundario {
    display: inline-block;
    border-radius: var(--radio);
    padding: 13px 24px;
    font-family: var(--fuente-texto);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.18s ease, opacity 0.18s ease;
  }
  .btn-primario { background: var(--bordo); color: var(--blanco); border: none; }
  .btn-primario:hover { background: var(--bordo-oscuro); }
  .btn-secundario { background: var(--crema-suave); color: var(--gris-texto); border: 1.5px solid var(--gris-borde); }
  .btn-secundario:hover { border-color: var(--bordo-claro); }
</style>
</head>
<body>

<div class="tarjeta">
  <div class="logo-texto">Indómita Love Club</div>

  <div class="pantalla-estado">
    <div class="icono">💔</div>
    <h1>Cancelaste el pago</h1>
    <p>No se completó la suscripción con PayPal y no se realizó ningún cobro. Podés volver a intentarlo cuando quieras desde tu panel.</p>
    <div class="acciones">
      <a href="/app" class="btn-primario">Volver a mi panel</a>
    </div>
  </div>
</div>

<script>
  // Avisa al sistema que el cliente llegó a PayPal y canceló ahí (a
  // diferencia de nunca haber abierto el link) — así el panel de admin
  // puede distinguir "nunca lo tocó" de "lo abrió y se arrepintió".
  (function () {
    var params = new URLSearchParams(window.location.search);
    var baToken = params.get('ba_token') || params.get('token');
    if (!baToken) return;
    fetch('https://zthimkucjtuffzcmdbtf.supabase.co/functions/v1/marcar-pago-cancelado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ba_token: baToken }),
    }).catch(function () {
      // Si esto falla no afecta al usuario, solo perdemos el dato de seguimiento.
    });
  })();
</script>

</body>
</html>
