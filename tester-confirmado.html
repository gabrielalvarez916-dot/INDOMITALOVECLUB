<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirmación de tester — Indómita Love Club</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bordo: #8B1A2B;
    --bordo-oscuro: #5C0F1A;
    --bordo-claro: #B03048;
    --rosa: #F2C4CE;
    --rosa-claro: #FAE8EC;
    --crema: #F5ECD7;
    --crema-suave: #FAF7F4;
    --blanco: #FFFFFF;
    --gris-texto: #2A2A2A;
    --gris-medio: #666666;
    --gris-borde: #E5E0D8;
    --fuente-titulo: 'Playfair Display', Georgia, serif;
    --fuente-texto: 'Lato', sans-serif;
    --radio-grande: 18px;
    --sombra-fuerte: 0 8px 40px rgba(139, 26, 43, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--fuente-texto);
    background: linear-gradient(160deg, var(--crema-suave), var(--rosa-claro));
    color: var(--gris-texto);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .tarjeta {
    background: var(--blanco);
    border-radius: var(--radio-grande);
    box-shadow: var(--sombra-fuerte);
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
  }
  .logo-texto {
    font-family: var(--fuente-titulo);
    font-weight: 700;
    font-size: 15px;
    color: var(--bordo);
    text-align: center;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
    text-transform: uppercase;
    opacity: 0.75;
  }
  .pantalla-estado { text-align: center; padding: 12px 0; }
  .pantalla-estado .icono { font-size: 52px; margin-bottom: 16px; }
  .pantalla-estado h1 {
    font-family: var(--fuente-titulo);
    font-size: 24px;
    color: var(--bordo-oscuro);
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .pantalla-estado p { color: var(--gris-medio); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div class="tarjeta">
  <div class="logo-texto">Indómita Love Club</div>

  <div id="vista" class="pantalla-estado">
    <div class="icono">🖤</div>
    <h1 id="titulo">¡Gracias por sumarte!</h1>
    <p id="mensaje">Quedaste anotad@ como tester. En cuanto esté listo el acceso a la prueba cerrada te mandamos el link para instalar la app. Falta poco.</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const estado = params.get('estado');
  const alias = params.get('alias');

  if (estado === 'error') {
    document.querySelector('#vista .icono').textContent = '✨';
    document.getElementById('titulo').textContent = 'Link inválido';
    document.getElementById('mensaje').textContent = 'Este link no es válido o venció. Escribinos si necesitás uno nuevo.';
  } else if (alias) {
    document.getElementById('titulo').textContent = `¡Gracias por sumarte, ${alias}!`;
  }
</script>

</body>
</html>
